name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q sunday scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_model_routing.py
      - run: python scripts/sync_versions.py

  wsl-contract:
    runs-on: ubuntu-latest
    env:
      WSL_DISTRO_NAME: Ubuntu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m unittest tests.test_cross_platform -v
