name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m compileall -q sunday scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_model_routing.py
      - run: python scripts/sync_versions.py

  wsl-contract:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run the cross-platform contract inside WSL 2
        shell: pwsh
        run: ./scripts/test_wsl.ps1 -TestTarget tests.test_cross_platform
