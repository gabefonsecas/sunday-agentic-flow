name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  wsl-release-gate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run the release suite inside WSL 2
        shell: pwsh
        run: ./scripts/test_wsl.ps1

  release:
    needs: wsl-release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate tag matches the packaged version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "v${version}" = "$GITHUB_REF_NAME"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q sunday scripts tests
      - run: python scripts/sync_versions.py
      - name: Build portable archive
        run: |
          archive="sunday-agentic-flow-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=sunday-agentic-flow/ --output="$archive" HEAD
          sha256sum "$archive" > "${archive}.sha256"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: sunday-agentic-flow-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            sunday-agentic-flow-${{ github.ref_name }}.zip
            sunday-agentic-flow-${{ github.ref_name }}.zip.sha256
