name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  wsl-release-gate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run the release suite inside WSL 2
        shell: pwsh
        run: ./scripts/test_wsl.ps1

  release:
    needs: wsl-release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Synchronize version with release tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          echo "$tag_version" > VERSION
          python scripts/sync_versions.py --write
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q sunday scripts tests
      - run: python scripts/sync_versions.py
      - name: Build portable archive
        run: |
          archive="sunday-agentic-flow-${GITHUB_REF_NAME}.zip"
          prefix="sunday-agentic-flow/"
          git archive --format=zip --prefix="$prefix" --output="$archive" HEAD
          python -c "
import zipfile, pathlib
archive = '$archive'
prefix = '$prefix'
files_to_update = {
    'VERSION': pathlib.Path('VERSION').read_bytes(),
    'pyproject.toml': pathlib.Path('pyproject.toml').read_bytes(),
    '.codex-plugin/plugin.json': pathlib.Path('.codex-plugin/plugin.json').read_bytes(),
    '.claude-plugin/plugin.json': pathlib.Path('.claude-plugin/plugin.json').read_bytes(),
    'gemini-extension.json': pathlib.Path('gemini-extension.json').read_bytes(),
}
target_names = {f'{prefix}{rel}' for rel in files_to_update}
temp_zip = archive + '.tmp'
with zipfile.ZipFile(archive, 'r') as zin, zipfile.ZipFile(temp_zip, 'w', zipfile.ZIP_DEFLATED) as zout:
    for item in zin.infolist():
        if item.filename not in target_names:
            zout.writestr(item, zin.read(item.filename))
    for rel_path, data in files_to_update.items():
        zout.writestr(f'{prefix}{rel_path}', data)
pathlib.Path(temp_zip).replace(archive)
"
          sha256sum "$archive" > "${archive}.sha256"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: sunday-agentic-flow-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            sunday-agentic-flow-${{ github.ref_name }}.zip
            sunday-agentic-flow-${{ github.ref_name }}.zip.sha256
