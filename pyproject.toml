[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunday-agentic-flow"
version = "1.0.4"
description = "Deterministic, portable development orchestration across AI coding hosts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Gabriel Fonseca"}]
dependencies = []

[project.scripts]
sunday = "sunday.cli:main"
sunday-friday-mcp = "sunday.friday_proxy:main"

[tool.setuptools.packages.find]
include = ["sunday*"]

[tool.unittest]
start-directory = "tests"
